[project]
name = "abaqus-cae-skill"
version = "0.1.1"
description = "A thin Agent Skill and dependency-free CLI for the active Abaqus/CAE session."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.urls]
Homepage = "https://github.com/Whfkl/abaqus-cae-skill"
Source = "https://github.com/Whfkl/abaqus-cae-skill"
Issues = "https://github.com/Whfkl/abaqus-cae-skill/issues"

[project.scripts]
abaqus-cae = "abaqus_cae_skill.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts/abaqus_cae_skill"]

[tool.hatch.build.targets.wheel.force-include]
"SKILL.md" = "abaqus_cae_skill/skill/SKILL.md"
"agents/openai.yaml" = "abaqus_cae_skill/skill/agents/openai.yaml"
"scripts/abaqus_cae.py" = "abaqus_cae_skill/skill/scripts/abaqus_cae.py"
"LICENSE" = "abaqus_cae_skill/skill/LICENSE"
"NOTICE.md" = "abaqus_cae_skill/skill/NOTICE.md"

[tool.hatch.build.targets.sdist]
exclude = ["/test", "/tests", "/.verification"]

[tool.uv]
package = true
